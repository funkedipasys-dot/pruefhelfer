<meta charset="utf-8" />
<title>Prüfhelfer Lite</title>
<link rel="stylesheet" href="popup.css" />

<main>
  <!-- Der Update-Hinweis sitzt in der Titelzeile, nicht darunter: dort unten
       hat ihn niemand gesehen. -->
  <header class="titlebar">
    <h1>Prüfhelfer Lite</h1>
    <a id="update-notice" class="update-notice" href="https://github.com/funkedipasys-dot/pruefhelfer/releases" target="_blank" rel="noopener" hidden>
      <span id="update-link">Update verfügbar</span>
    </a>
  </header>

  <p class="lead">
    Textbausteine und Kilometerstand erscheinen direkt am Feld im
    Produktionstool. Wird dort kein Feld erkannt, kannst du einen Text hier
    kopieren und von Hand einsetzen.
  </p>

  <!-- FSD-Automatik als Dauereinstellung. Scharf wird sie erst, wenn der
       Rechner drei Minuten ohne Bedienung ist — der Hintergrunddienst merkt
       das in chrome.storage, die Seite liest es dort. -->
  <label class="schalter">
    <input id="fsd-automatik" type="checkbox">
    FSD-Automatik im Leerlauf — nach 3 Minuten ohne Bedienung öffnet sie neue Aufträge
  </label>

  <div id="chooser"></div>
</main>

<script type="module" src="popup.js"></script>
