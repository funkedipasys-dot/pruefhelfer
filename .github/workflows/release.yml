name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm package
      # Konstanter Asset-Name — dadurch bleibt der "latest"-Download-Link der Website stabil:
      # https://github.com/funkedipasys-dot/pruefhelfer/releases/latest/download/pruefhelfer.zip
      - run: cd dist && zip -r ../pruefhelfer.zip .
      - uses: softprops/action-gh-release@v2
        with:
          files: pruefhelfer.zip
          generate_release_notes: true
